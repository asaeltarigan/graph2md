[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "graph2md"
version = "1.0.0"
description = "Download Markdown (and other text files) from OneDrive/SharePoint through the Microsoft Graph API."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Gabriel Asael Tarigan" }]
keywords = ["microsoft-graph", "onedrive", "markdown", "cli", "obsidian"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: File Managers",
]
dependencies = []

[project.optional-dependencies]
test = []

[project.scripts]
graph2md = "graph2md.cli:main"

[tool.setuptools]
packages = ["graph2md"]
